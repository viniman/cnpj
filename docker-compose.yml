services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar_cnpj}
      POSTGRES_USER: ${POSTGRES_USER:-radar_cnpj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_cnpj_local}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "checkpoint_timeout=30min"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "wal_buffers=64MB"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  radar-cnpj:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      RADAR_CNPJ_HOST: 0.0.0.0
      RADAR_CNPJ_PORT: 8000
      RADAR_CNPJ_POSTGRES_DSN: postgresql://${POSTGRES_USER:-radar_cnpj}:${POSTGRES_PASSWORD:-radar_cnpj_local}@postgres:5432/${POSTGRES_DB:-radar_cnpj}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
